  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Jordan's Learning Map — Grade 8 Math<\u002Ftitle>\n\n<script src=\"a0409f1b-3687-4eb9-aef2-91107ed7d405\"><\u002Fscript>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    background: #0a0a12;\n    color: #e4e4f0;\n    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    overflow: hidden;\n    width: 100vw; height: 100vh;\n  }\n\n  svg { position: absolute; top: 0; left: 250px; width: calc(100% - 250px); height: 100%; display: block; }\n\n  /* ── Node states ── */\n  .node-group { cursor: pointer; }\n\n  /* ── Tooltip ── */\n  #tooltip {\n    position: absolute;\n    background: rgba(10,10,20,0.98);\n    border-radius: 12px;\n    padding: 16px 20px;\n    max-width: 280px;\n    pointer-events: none;\n    opacity: 0;\n    transition: opacity 0.15s;\n    z-index: 100;\n    backdrop-filter: blur(10px);\n  }\n  #tooltip.visible { opacity: 1; }\n  .t-status { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }\n  .t-name   { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 3px; }\n  .t-std    { font-size: 11px; color: rgba(228,228,240,0.45); margin-bottom: 10px; }\n  .t-insight{ font-size: 12px; line-height: 1.55; color: rgba(228,228,240,0.8); }\n  .t-tag    { display: inline-block; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px; margin-top: 10px; }\n\n  /* ── Student card ── */\n  #student-card {\n    position: absolute;\n    top: 24px; left: 24px;\n    width: 220px;\n  pointer-events: none;\n  }\n  .sc-avatar {\n    width: 42px; height: 42px; border-radius: 50%;\n    background: linear-gradient(135deg, #4ecbb4, #7c6af7);\n    display: flex; align-items: center; justify-content: center;\n    font-size: 18px; font-weight: 700; color: #fff;\n    margin-bottom: 10px;\n  }\n  .sc-name  { font-size: 20px; font-weight: 700; color: #fff; }\n  .sc-grade { font-size: 11px; color: rgba(228,228,240,0.45); margin-top: 2px; letter-spacing: 0.05em; }\n  .sc-stats { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }\n  .sc-stat-row { display: flex; align-items: center; justify-content: space-between; }\n  .sc-stat-label { font-size: 11px; color: rgba(228,228,240,0.5); }\n  .sc-stat-bar { width: 90px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }\n  .sc-stat-fill { height: 100%; border-radius: 3px; }\n  .sc-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 14px 0; }\n  .sc-label  { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(228,228,240,0.3); margin-bottom: 8px; }\n  .sc-misconception {\n    background: rgba(255,80,80,0.1);\n    border: 1px solid rgba(255,80,80,0.25);\n    border-radius: 8px;\n    padding: 8px 10px;\n    font-size: 11px;\n    color: rgba(255,160,160,0.9);\n    line-height: 1.45;\n    margin-bottom: 6px;\n  }\n  .sc-misconception strong { color: #ff8080; }\n  .sc-next {\n    background: rgba(247,201,72,0.1);\n    border: 1px solid rgba(247,201,72,0.25);\n    border-radius: 8px;\n    padding: 8px 10px;\n    font-size: 11px;\n    color: rgba(247,220,140,0.9);\n    line-height: 1.45;\n  }\n  .sc-next strong { color: #f7c948; }\n\n  /* ── Legend ── */\n  #legend {\n    position: absolute;\n    bottom: 24px; right: 24px;\n    display: flex; flex-direction: column; gap: 9px;\n  }\n  .leg { display: flex; align-items: center; gap: 9px; font-size: 11px; color: rgba(228,228,240,0.5); }\n  .leg-icon { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }\n  .leg-icon.mastered  { background: #4ecbb4; }\n  .leg-icon.progress  { background: #7c6af7; border: 2px dashed #b9a8ff; }\n  .leg-icon.blocked   { background: transparent; border: 2px solid #3a3a52; }\n  .leg-icon.misconception { background: #ff5050; }\n  .leg-icon.recommended { background: #f7c948; box-shadow: 0 0 8px #f7c94888; }\n\n  /* ── Pulse animation for recommended ── */\n  @keyframes pulse {\n    0%   { transform: scale(1); opacity: 0.7; }\n    50%  { transform: scale(1.5); opacity: 0; }\n    100% { transform: scale(1); opacity: 0; }\n  }\n  .pulse-ring { animation: pulse 2s ease-out infinite; transform-origin: center; }\n\n  /* ── Flow animation ── */\n  @keyframes flowOn {\n    from { stroke-dashoffset: 18; }\n    to   { stroke-dashoffset: 0; }\n  }\n  .edge-flow { stroke-dasharray: 5 4; animation: flowOn 0.9s linear infinite; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- Student card -->\n<div id=\"student-card\">\n  <div class=\"sc-avatar\">J<\u002Fdiv>\n  <div class=\"sc-name\">Jordan M.<\u002Fdiv>\n  <div class=\"sc-grade\">Grade 8 · Period 3 · Ms. Rivera<\u002Fdiv>\n  <div class=\"sc-stats\">\n    <div class=\"sc-stat-row\">\n      <span class=\"sc-stat-label\">Mastered<\u002Fspan>\n      <div class=\"sc-stat-bar\"><div class=\"sc-stat-fill\" style=\"width:45%;background:#4ecbb4\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sc-stat-row\">\n      <span class=\"sc-stat-label\">In Progress<\u002Fspan>\n      <div class=\"sc-stat-bar\"><div class=\"sc-stat-fill\" style=\"width:25%;background:#7c6af7\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sc-stat-row\">\n      <span class=\"sc-stat-label\">Blocked<\u002Fspan>\n      <div class=\"sc-stat-bar\"><div class=\"sc-stat-fill\" style=\"width:30%;background:#3a3a52\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sc-divider\"><\u002Fdiv>\n  <div class=\"sc-label\">Active Misconceptions<\u002Fdiv>\n  <div class=\"sc-misconception\">\n    <strong>Linear Equations<\u002Fstrong><br>\n    Moves terms without preserving balance — treats \"=\" as a separator, not equivalence.\n  <\u002Fdiv>\n  <div class=\"sc-misconception\">\n    <strong>Functions<\u002Fstrong><br>\n    Believes every function must be linear; rejects tables with curved relationships.\n  <\u002Fdiv>\n  <div class=\"sc-divider\"><\u002Fdiv>\n  <div class=\"sc-label\">Recommended Next<\u002Fdiv>\n  <div class=\"sc-next\">\n    <strong>Systems of Equations<\u002Fstrong><br>\n    Jordan's algebra fluency is ready — this unlocks Functions track.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<svg id=\"graph\"><\u002Fsvg>\n<div id=\"tooltip\"><\u002Fdiv>\n\n<div id=\"legend\">\n  <div class=\"leg\"><div class=\"leg-icon mastered\"><\u002Fdiv> Mastered<\u002Fdiv>\n  <div class=\"leg\"><div class=\"leg-icon progress\"><\u002Fdiv> In Progress<\u002Fdiv>\n  <div class=\"leg\"><div class=\"leg-icon misconception\"><\u002Fdiv> Misconception<\u002Fdiv>\n  <div class=\"leg\"><div class=\"leg-icon blocked\"><\u002Fdiv> Blocked / Not Started<\u002Fdiv>\n  <div class=\"leg\"><div class=\"leg-icon recommended\"><\u002Fdiv> Recommended Next<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst W = 1400, H = 860;\n\n// ── STUDENT STATE ──────────────────────────────────────────────────────────\n// Status: mastered | progress | misconception | blocked | recommended\nconst STUDENT = {\n  p1:  { status: \"mastered\",      score: 94, insight: \"Strong foundation. Jordan comfortably converts between fractions, decimals, and negative numbers.\" },\n  p2:  { status: \"mastered\",      score: 88, insight: \"Proportional reasoning is solid — Jordan correctly sets up unit rates and cross-multiplication.\" },\n  p3:  { status: \"mastered\",      score: 82, insight: \"Can simplify expressions and solve one-step equations. Struggles slightly with multi-step.\" },\n  p4:  { status: \"progress\",      score: 61, insight: \"Gets area/perimeter but mixes up surface area and volume formulas when shapes are combined.\" },\n  p5:  { status: \"mastered\",      score: 79, insight: \"Understands mean, median, mode, and can read bar charts. Ready to interpret scatter plots.\" },\n  ns1: { status: \"mastered\",      score: 91, insight: \"Correctly identifies π and √2 as irrational. Can place them on a number line using approximation.\" },\n  ns2: { status: \"mastered\",      score: 85, insight: \"Evaluates √25, ∛27 fluently. Occasionally second-guesses cube roots of non-perfect cubes.\" },\n  ee1: { status: \"mastered\",      score: 87, insight: \"Applies all 7 exponent rules correctly. Doesn't hesitate on negative exponents.\" },\n  ee2: { status: \"mastered\",      score: 80, insight: \"Converts to/from scientific notation accurately. Multiplication of SN expressions is reliable.\" },\n  ee3: { status: \"misconception\", score: 52, insight: \"Solves simple one-step equations but uses ad-hoc term-moving rather than inverse operations. Breaks down on equations with variables on both sides.\", tag: \"⚠ Misconception: Equality as separator\" },\n  ee4: { status: \"blocked\",       score: null, insight: \"Requires fluency with linear equations first. Jordan is not yet ready for two-variable systems.\" },\n  fn1: { status: \"misconception\", score: 48, insight: \"Can list input/output pairs but rejects non-linear tables as 'not real functions.' Confuses linearity with the definition of a function.\", tag: \"⚠ Misconception: Functions must be linear\" },\n  fn2: { status: \"blocked\",       score: null, insight: \"Comparing functions requires a firm grasp of the function definition, which Jordan is still building.\" },\n  fn3: { status: \"blocked\",       score: null, insight: \"Interpreting slope and y-intercept depends on equation fluency Jordan hasn't consolidated yet.\" },\n  g1:  { status: \"progress\",      score: 68, insight: \"Handles translations and reflections well on a grid. Confuses rotation direction (clockwise vs. counterclockwise).\" },\n  g2:  { status: \"blocked\",       score: null, insight: \"Congruence via rigid motions requires transformation fluency Jordan is still developing.\" },\n  g3:  { status: \"progress\",      score: 71, insight: \"Knows a² + b² = c² and can apply it to find a missing side. Trips up when the hypotenuse is given and a leg is missing.\" },\n  g4:  { status: \"blocked\",       score: null, insight: \"Volume formulas for cones/spheres require stronger geometric intuition. Not yet introduced.\" },\n  sp1: { status: \"progress\",      score: 74, insight: \"Can construct scatter plots and identify clusters. Tends to draw lines of fit that pass through the origin by default.\" },\n  sp2: { status: \"blocked\",       score: null, insight: \"Interpreting linear models in context requires the linear equation fluency Jordan is working on.\" },\n  nx1: { status: \"recommended\",   score: null, insight: \"Jordan's algebra work is almost ready for Algebra I. Fixing the linear equations misconception is the last gate.\" },\n  nx2: { status: \"blocked\",       score: null, insight: \"Geometry track needs transformation and Pythagorean theorem completion first.\" },\n  nx3: { status: \"blocked\",       score: null, insight: \"Statistics & Probability requires scatter plot and linear model fluency.\" },\n};\n\n// ── NODES ──────────────────────────────────────────────────────────────────\nconst NODES = [\n  { id:\"p1\",  layer:0, domain:\"prereq\", name:\"Rational\\nNumbers\",      std:\"7.NS\",     dy:-210 },\n  { id:\"p2\",  layer:0, domain:\"prereq\", name:\"Proportional\\nReasoning\",std:\"7.RP\",     dy:-80  },\n  { id:\"p3\",  layer:0, domain:\"prereq\", name:\"Expressions\\n& Equations\",std:\"7.EE\",   dy: 60  },\n  { id:\"p4\",  layer:0, domain:\"prereq\", name:\"Geometry\\nBasics\",       std:\"6–7.G\",    dy: 230 },\n  { id:\"p5\",  layer:0, domain:\"prereq\", name:\"Statistics\",             std:\"6–7.SP\",   dy: 360 },\n\n  { id:\"ns1\", layer:1, domain:\"ns\",  name:\"Irrational\\nNumbers\",      std:\"8.NS.1–2\", dy:-240 },\n  { id:\"ns2\", layer:1, domain:\"ns\",  name:\"Square &\\nCube Roots\",     std:\"8.EE.2\",   dy:-110 },\n  { id:\"ee1\", layer:1, domain:\"ee\",  name:\"Integer\\nExponents\",       std:\"8.EE.1\",   dy: 20  },\n  { id:\"ee2\", layer:1, domain:\"ee\",  name:\"Scientific\\nNotation\",     std:\"8.EE.3–4\", dy: 145 },\n  { id:\"g1\",  layer:1, domain:\"geo\", name:\"Transformations\",          std:\"8.G.1–3\",  dy: 290 },\n  { id:\"g3\",  layer:1, domain:\"geo\", name:\"Pythagorean\\nTheorem\",     std:\"8.G.6–8\",  dy: 400 },\n  { id:\"sp1\", layer:1, domain:\"sp\",  name:\"Scatter\\nPlots\",           std:\"8.SP.1–2\", dy: 520 },\n\n  { id:\"ee3\", layer:2, domain:\"ee\",  name:\"Linear\\nEquations\",        std:\"8.EE.7\",   dy: 40  },\n  { id:\"fn1\", layer:2, domain:\"fn\",  name:\"Define\\nFunctions\",        std:\"8.F.1\",    dy:-140 },\n  { id:\"g2\",  layer:2, domain:\"geo\", name:\"Congruence\\n& Similarity\",  std:\"8.G.4–5\", dy: 290 },\n  { id:\"sp2\", layer:2, domain:\"sp\",  name:\"Linear\\nAssociations\",     std:\"8.SP.3–4\", dy: 460 },\n\n  { id:\"ee4\", layer:3, domain:\"ee\",  name:\"Systems of\\nEquations\",    std:\"8.EE.8\",   dy: 40  },\n  { id:\"fn2\", layer:3, domain:\"fn\",  name:\"Compare\\nFunctions\",       std:\"8.F.2\",    dy:-220 },\n  { id:\"fn3\", layer:3, domain:\"fn\",  name:\"Linear\\nFunctions\",        std:\"8.F.3–5\",  dy:-80  },\n  { id:\"g4\",  layer:3, domain:\"geo\", name:\"Volume of\\nSolids\",        std:\"8.G.9\",    dy: 330 },\n\n  { id:\"nx1\", layer:4, domain:\"next\", name:\"Algebra I\",               std:\"HS\",        dy:-100 },\n  { id:\"nx2\", layer:4, domain:\"next\", name:\"Geometry\",                std:\"HS\",        dy: 160 },\n  { id:\"nx3\", layer:4, domain:\"next\", name:\"Statistics &\\nProbability\",std:\"HS\",       dy: 390 },\n];\n\nconst EDGES = [\n  {s:\"p1\", t:\"ns1\"},{s:\"p1\", t:\"ns2\"},\n  {s:\"p2\", t:\"ee1\"},{s:\"p2\", t:\"fn1\"},{s:\"p2\", t:\"ee3\"},\n  {s:\"p3\", t:\"ee1\"},{s:\"p3\", t:\"ee2\"},{s:\"p3\", t:\"ee3\"},\n  {s:\"p4\", t:\"g1\"}, {s:\"p4\", t:\"g3\"},\n  {s:\"p5\", t:\"sp1\"},\n  {s:\"ns2\", t:\"ee1\"},\n  {s:\"ee1\", t:\"ee2\"},{s:\"ee1\", t:\"ee3\"},\n  {s:\"ee3\", t:\"ee4\"},{s:\"ee3\", t:\"fn1\"},{s:\"ee3\", t:\"sp2\"},\n  {s:\"fn1\", t:\"fn2\"},{s:\"fn1\", t:\"fn3\"},\n  {s:\"fn3\", t:\"ee4\"},{s:\"fn3\", t:\"sp2\"},\n  {s:\"g1\",  t:\"g2\"}, {s:\"g2\", t:\"g3\"},\n  {s:\"g3\",  t:\"g4\"},\n  {s:\"sp1\", t:\"sp2\"},\n  {s:\"ee4\", t:\"nx1\"},{s:\"fn3\", t:\"nx1\"},{s:\"fn2\", t:\"nx1\"},\n  {s:\"g4\",  t:\"nx2\"},{s:\"g2\", t:\"nx2\"},\n  {s:\"sp2\", t:\"nx3\"},{s:\"fn3\", t:\"nx3\"},\n];\n\n// ── STATUS CONFIG ──────────────────────────────────────────────────────────\nconst STATUS = {\n  mastered:      { fill:\"#0e2420\", stroke:\"#4ecbb4\", glow:\"#4ecbb4\", label:\"Mastered\" },\n  progress:      { fill:\"#13102a\", stroke:\"#7c6af7\", glow:\"#7c6af7\", label:\"In Progress\" },\n  misconception: { fill:\"#200d0d\", stroke:\"#ff5050\", glow:\"#ff5050\", label:\"Misconception\" },\n  blocked:       { fill:\"#0d0d16\", stroke:\"#2a2a40\", glow:\"none\",    label:\"Not Yet\" },\n  recommended:   { fill:\"#231b00\", stroke:\"#f7c948\", glow:\"#f7c948\", label:\"Recommended\" },\n};\n\n// Layer X positions\nconst layerXMap = [0.21, 0.36, 0.53, 0.69, 0.87];\nconst CY = H / 2 + 10;\n\nconst nodeMap = {};\nNODES.forEach(n => {\n  n.x = W * layerXMap[n.layer];\n  n.y = CY + (n.dy || 0);\n  n.r = 36;\n  const st = STUDENT[n.id] || { status:\"blocked\" };\n  n.status = st.status;\n  nodeMap[n.id] = n;\n});\n\n// ── SVG SETUP ──────────────────────────────────────────────────────────────\nconst svg = d3.select(\"#graph\").attr(\"viewBox\", `0 0 ${W} ${H}`).attr(\"preserveAspectRatio\",\"xMidYMid meet\");\nconst defs = svg.append(\"defs\");\n\n// Glow filters\nObject.entries(STATUS).forEach(([key, s]) => {\n  if (s.glow === \"none\") return;\n  const f = defs.append(\"filter\").attr(\"id\",`glow-${key}`).attr(\"x\",\"-60%\").attr(\"y\",\"-60%\").attr(\"width\",\"220%\").attr(\"height\",\"220%\");\n  f.append(\"feGaussianBlur\").attr(\"stdDeviation\",\"8\").attr(\"result\",\"blur\");\n  const m = f.append(\"feMerge\");\n  m.append(\"feMergeNode\").attr(\"in\",\"blur\");\n  m.append(\"feMergeNode\").attr(\"in\",\"SourceGraphic\");\n});\n\n// Edge gradients\nEDGES.forEach((e,i) => {\n  const sn = nodeMap[e.s], tn = nodeMap[e.t];\n  const sc = STATUS[sn.status].stroke, tc = STATUS[tn.status].stroke;\n  const g = defs.append(\"linearGradient\").attr(\"id\",`eg-${i}`).attr(\"gradientUnits\",\"userSpaceOnUse\")\n    .attr(\"x1\",sn.x).attr(\"y1\",sn.y).attr(\"x2\",tn.x).attr(\"y2\",tn.y);\n  g.append(\"stop\").attr(\"offset\",\"0%\").attr(\"stop-color\",sc).attr(\"stop-opacity\", sn.status===\"blocked\"?0.15:0.5);\n  g.append(\"stop\").attr(\"offset\",\"100%\").attr(\"stop-color\",tc).attr(\"stop-opacity\", tn.status===\"blocked\"?0.15:0.5);\n});\n\n// ── LAYER LABELS ──────────────────────────────────────────────────────────\nconst LLABELS = [[\"Prerequisites\",\"Gr. 6–7\"],[\"Foundations\",\"8th Grade\"],[\"Core Skills\",\"8th Grade\"],[\"Advanced\",\"8th Grade\"],[\"Next\",\"Courses\"]];\nlayerXMap.forEach((lx, i) => {\n  LLABELS[i].forEach((line, li) => {\n    svg.append(\"text\")\n      .attr(\"x\", W * lx).attr(\"y\", 28 + li*14)\n      .attr(\"text-anchor\",\"middle\")\n      .attr(\"font-size\", li===0 ? 11 : 10)\n      .attr(\"font-weight\", li===0 ? 700 : 400)\n      .attr(\"letter-spacing\",\"0.08em\")\n      .attr(\"fill\",\"rgba(228,228,240,0.22)\")\n      .text(line.toUpperCase());\n  });\n});\n\n// ── EDGES ─────────────────────────────────────────────────────────────────\nconst masterEdges = EDGES.filter(e => {\n  return STUDENT[e.s]?.status === \"mastered\" && STUDENT[e.t]?.status === \"mastered\";\n});\n\nconst edgeSel = svg.append(\"g\").selectAll(\"path\").data(EDGES).join(\"path\")\n  .attr(\"fill\",\"none\")\n  .attr(\"stroke\", (d,i) => `url(#eg-${i})`)\n  .attr(\"stroke-width\", d => {\n    const ss = STUDENT[d.s]?.status, ts = STUDENT[d.t]?.status;\n    return (ss===\"mastered\"||ss===\"progress\"||ss===\"misconception\") ? 1.8 : 1;\n  })\n  .attr(\"class\", d => {\n    const ss = STUDENT[d.s]?.status;\n    return (ss===\"mastered\"||ss===\"progress\") ? \"edge-flow\" : \"\";\n  })\n  .attr(\"d\", d => {\n    const s = nodeMap[d.s], t = nodeMap[d.t];\n    const mx = (s.x+t.x)/2;\n    return `M${s.x},${s.y} C${mx},${s.y} ${mx},${t.y} ${t.x},${t.y}`;\n  });\n\n// ── NODES ─────────────────────────────────────────────────────────────────\nconst nodeGroups = svg.append(\"g\").selectAll(\".node-group\").data(NODES).join(\"g\")\n  .attr(\"class\",\"node-group\")\n  .attr(\"transform\", d => `translate(${d.x},${d.y})`);\n\n// Pulse ring for recommended\nnodeGroups.filter(d => d.status===\"recommended\").append(\"circle\")\n  .attr(\"class\",\"pulse-ring\")\n  .attr(\"r\", 50)\n  .attr(\"fill\",\"none\")\n  .attr(\"stroke\",\"#f7c948\")\n  .attr(\"stroke-width\",\"1.5\")\n  .attr(\"opacity\",\"0\");\n\n// Outer halo\nnodeGroups.append(\"circle\")\n  .attr(\"r\", d => d.status===\"blocked\" ? 0 : 44)\n  .attr(\"fill\", d => STATUS[d.status].stroke + \"14\")\n  .attr(\"stroke\",\"none\");\n\n// Main circle\nnodeGroups.append(\"circle\")\n  .attr(\"r\", 36)\n  .attr(\"fill\", d => STATUS[d.status].fill)\n  .attr(\"stroke\", d => STATUS[d.status].stroke)\n  .attr(\"stroke-width\", d => d.status===\"blocked\" ? 1 : d.status===\"recommended\" ? 2.5 : 2)\n  .attr(\"stroke-dasharray\", d => d.status===\"progress\" ? \"5,3\" : null)\n  .attr(\"filter\", d => d.status!==\"blocked\" ? `url(#glow-${d.status})` : null);\n\n// Score arc for mastered/progress nodes\nnodeGroups.filter(d => STUDENT[d.id]?.score != null).each(function(d) {\n  const score = STUDENT[d.id].score / 100;\n  const r = 40, circ = 2*Math.PI*r;\n  d3.select(this).append(\"circle\")\n    .attr(\"r\", r)\n    .attr(\"fill\",\"none\")\n    .attr(\"stroke\", STATUS[d.status].stroke)\n    .attr(\"stroke-width\",\"2\")\n    .attr(\"stroke-dasharray\", `${score*circ} ${circ}`)\n    .attr(\"stroke-dashoffset\", circ * 0.25)\n    .attr(\"opacity\",\"0.3\")\n    .attr(\"transform\",\"rotate(-90)\");\n});\n\n// Misconception badge\nnodeGroups.filter(d => d.status===\"misconception\").append(\"circle\")\n  .attr(\"cx\", 24).attr(\"cy\",-24).attr(\"r\",10)\n  .attr(\"fill\",\"#ff5050\").attr(\"stroke\",\"#0a0a12\").attr(\"stroke-width\",2);\nnodeGroups.filter(d => d.status===\"misconception\").append(\"text\")\n  .attr(\"x\",24).attr(\"y\",-24).attr(\"text-anchor\",\"middle\").attr(\"dy\",\"0.35em\")\n  .attr(\"font-size\",\"11\").attr(\"font-weight\",\"700\").attr(\"fill\",\"#fff\").text(\"!\");\n\n// Star badge for recommended\nnodeGroups.filter(d => d.status===\"recommended\").append(\"circle\")\n  .attr(\"cx\", 24).attr(\"cy\",-24).attr(\"r\",10)\n  .attr(\"fill\",\"#f7c948\").attr(\"stroke\",\"#0a0a12\").attr(\"stroke-width\",2);\nnodeGroups.filter(d => d.status===\"recommended\").append(\"text\")\n  .attr(\"x\",24).attr(\"y\",-24).attr(\"text-anchor\",\"middle\").attr(\"dy\",\"0.35em\")\n  .attr(\"font-size\",\"11\").attr(\"font-weight\",\"700\").attr(\"fill\",\"#0a0a12\").text(\"→\");\n\n// Labels\nnodeGroups.each(function(d) {\n  const lines = d.name.split(\"\\n\");\n  const g = d3.select(this);\n  const startY = lines.length === 1 ? 0 : -9;\n  const col = d.status===\"blocked\" ? \"rgba(228,228,240,0.3)\" : \"#fff\";\n  lines.forEach((line,i) => {\n    g.append(\"text\")\n      .attr(\"text-anchor\",\"middle\")\n      .attr(\"y\", startY + i*14)\n      .attr(\"dy\",\"0.35em\")\n      .attr(\"font-size\",\"11\")\n      .attr(\"font-weight\",\"600\")\n      .attr(\"fill\", col)\n      .attr(\"pointer-events\",\"none\")\n      .text(line);\n  });\n  g.append(\"text\")\n    .attr(\"text-anchor\",\"middle\")\n    .attr(\"y\", lines.length===1 ? 17 : 23)\n    .attr(\"font-size\",\"9\")\n    .attr(\"fill\", d.status===\"blocked\" ? \"rgba(228,228,240,0.15)\" : \"rgba(228,228,240,0.45)\")\n    .attr(\"pointer-events\",\"none\")\n    .text(d.std);\n});\n\n// ── TOOLTIP ───────────────────────────────────────────────────────────────\nconst tooltip = document.getElementById(\"tooltip\");\nlet activeNode = null;\n\nnodeGroups.on(\"mouseenter\", function(evt, d) {\n  if (activeNode && activeNode !== d.id) return;\n  showTip(evt, d);\n  highlightPaths(d.id);\n}).on(\"mousemove\", function(evt, d) {\n  if (activeNode && activeNode !== d.id) return;\n  moveTip(evt);\n}).on(\"mouseleave\", function(evt, d) {\n  if (activeNode) return;\n  tooltip.classList.remove(\"visible\");\n  resetHighlight();\n}).on(\"click\", function(evt, d) {\n  evt.stopPropagation();\n  if (activeNode === d.id) { activeNode=null; tooltip.classList.remove(\"visible\"); resetHighlight(); }\n  else { activeNode=d.id; showTip(evt,d); highlightPaths(d.id); }\n});\n\nd3.select(\"svg\").on(\"click\", () => { activeNode=null; tooltip.classList.remove(\"visible\"); resetHighlight(); });\n\nfunction showTip(evt, d) {\n  const st = STUDENT[d.id] || {};\n  const cfg = STATUS[d.status];\n  tooltip.innerHTML = `\n    <div class=\"t-status\" style=\"color:${cfg.stroke}\">${cfg.label}${st.score!=null ? ` · ${st.score}%` : ''}<\u002Fdiv>\n    <div class=\"t-name\">${d.name.replace(\"\\n\",\" \")}<\u002Fdiv>\n    <div class=\"t-std\">${d.std}<\u002Fdiv>\n    <div class=\"t-insight\">${st.insight||''}<\u002Fdiv>\n    ${st.tag ? `<div class=\"t-tag\" style=\"background:${cfg.stroke}22;color:${cfg.stroke}\">${st.tag}<\u002Fdiv>` : ''}\n  `;\n  tooltip.style.border = `1px solid ${cfg.stroke}44`;\n  moveTip(evt);\n  tooltip.classList.add(\"visible\");\n}\n\nfunction moveTip(evt) {\n  const rect = document.getElementById(\"graph\").getBoundingClientRect();\n  let tx = evt.clientX - rect.left + 18;\n  let ty = evt.clientY - rect.top - 20;\n  if (tx + 300 > rect.width) tx = evt.clientX - rect.left - 300;\n  tooltip.style.left = tx+\"px\"; tooltip.style.top = ty+\"px\";\n}\n\nfunction getReachable(id) {\n  const fwd = new Set([id]), bwd = new Set([id]);\n  let changed = true;\n  while(changed) {\n    changed = false;\n    EDGES.forEach(e => {\n      if(fwd.has(e.s) && !fwd.has(e.t)){fwd.add(e.t);changed=true;}\n      if(bwd.has(e.t) && !bwd.has(e.s)){bwd.add(e.s);changed=true;}\n    });\n  }\n  return new Set([...fwd, ...bwd]);\n}\n\nfunction highlightPaths(id) {\n  const reach = getReachable(id);\n  nodeGroups.select(\"circle:nth-child(3)\").attr(\"opacity\", d => reach.has(d.id) ? 1 : 0.15);\n  nodeGroups.selectAll(\"text\").attr(\"opacity\", d => reach.has(d.id) ? 1 : 0.15);\n  edgeSel.attr(\"opacity\", (d,i) => reach.has(d.s)&&reach.has(d.t) ? 0.9 : 0.05);\n}\n\nfunction resetHighlight() {\n  nodeGroups.select(\"circle:nth-child(3)\").attr(\"opacity\", 1);\n  nodeGroups.selectAll(\"text\").attr(\"opacity\", 1);\n  edgeSel.attr(\"opacity\", null);\n}\n<\u002Fscript>\n\n<!-- Tweaks -->\n<div id=\"tweaks-panel\">\n  <h3 style=\"font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(228,228,240,0.4);margin-bottom:14px;font-family:Helvetica Neue,sans-serif\">Tweaks<\u002Fh3>\n  <div style=\"display:flex;flex-direction:column;gap:10px;font-family:Helvetica Neue,sans-serif\">\n    <label style=\"font-size:11px;color:rgba(228,228,240,0.6)\">Student view<\u002Flabel>\n    <select id=\"student-select\" style=\"background:#1a1a28;border:1px solid rgba(255,255,255,0.12);color:#e4e4f0;font-size:11px;border-radius:6px;padding:5px 8px\">\n      <option>Jordan M. (struggling with equations)<\u002Foption>\n      <option>Alex T. (advanced — geometry gap)<\u002Foption>\n      <option>Priya K. (statistics-strong)<\u002Foption>\n    <\u002Fselect>\n    <label style=\"font-size:11px;color:rgba(228,228,240,0.6);margin-top:4px\">Show labels<\u002Flabel>\n    <input type=\"checkbox\" id=\"show-std\" checked=\"\" style=\"accent-color:#7c6af7\">\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<style>\n#tweaks-panel {\n  display: none; position: absolute; bottom: 24px; right: 24px;\n  background: rgba(10,10,20,0.97); border: 1px solid rgba(255,255,255,0.1);\n  border-radius: 12px; padding: 18px 20px; width: 220px; z-index: 200;\n  backdrop-filter: blur(10px);\n}\n<\u002Fstyle>\n<script>\nwindow.addEventListener(\"message\", e => {\n  if (e.data?.type===\"__activate_edit_mode\")   document.getElementById(\"tweaks-panel\").style.display=\"block\";\n  if (e.data?.type===\"__deactivate_edit_mode\") document.getElementById(\"tweaks-panel\").style.display=\"none\";\n});\nwindow.parent.postMessage({type:\"__edit_mode_available\"},\"*\");\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
